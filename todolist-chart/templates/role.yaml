apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: todolist
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: todolist
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  # /pods — listar pods do namespace
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # /pods — ler logs dos pods de cleanup
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # /cleanup/status — listar e atualizar CronJobs
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "patch"]
