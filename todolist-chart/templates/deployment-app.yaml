apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: todolist
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- /*
    Com o HPA ligado, spec.replicas e omitido do manifesto para que o
    autoscaler seja o unico dono do campo. Se ele fosse renderizado, cada
    `helm upgrade` (e cada sync do ArgoCD com selfHeal) reescreveria o valor
    do values.yaml por cima da decisao do HPA.
    Na primeira instalacao o Deployment sobe com 1 pod e o HPA ajusta para
    minReplicas em poucos segundos.
  */}}
  {{- if not .Values.app.hpa.enabled }}
  replicas: {{ .Values.app.replicas }}
  {{- end }}

  revisionHistoryLimit: 5

  {{- /*
    Rollout surge-first: maxUnavailable: 0 impede que a atualizacao reduza a
    capacidade abaixo do numero atual de replicas, evitando conflito com o PDB.
  */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: todolist
  template:
    metadata:
      labels:
        app: todolist
        app.kubernetes.io/name: todolist
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: todolist

      {{- /*
        Distribui as replicas entre os nos. Um PDB so protege de verdade se os
        pods estiverem em nos distintos: com todas as replicas no mesmo worker,
        drenar esse no derruba tudo de uma vez.
        whenUnsatisfiable: ScheduleAnyway permite que o scheduler empilhe pods
        quando necessario; DoNotSchedule deixaria pods Pending e travaria o
        scale-up do HPA.
      */}}
      {{- with .Values.app.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      terminationGracePeriodSeconds: {{ .Values.app.terminationGracePeriodSeconds }}

      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z todolist-postgres {{ .Values.postgresql.port }}; do
                echo "waiting for postgres..."; sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi

      containers:
        - name: todolist
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}

          {{- /*
            preStop segura o container pelo tempo necessario para o endpoint
            sair das tabelas do kube-proxy e do ingress-nginx antes do gunicorn
            comecar a fechar conexoes. Sem isso, o scale-down do HPA gera 502.
          */}}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.app.preStopSleepSeconds }}"]

          env:
            - name: APP_NAME
              value: {{ .Values.app.env.APP_NAME | quote }}
            - name: APP_COLOR
              value: {{ .Values.app.env.APP_COLOR | quote }}
            - name: APP_PORT
              value: {{ .Values.app.port | quote }}
            {{- /*
              O CMD da imagem nao passa --workers, entao o gunicorn sobe com 1
              worker sync: uma requisicao por vez por pod. Nesse regime o pod
              satura em latencia muito antes de a CPU media indicar carga, e o
              sinal do HPA fica ruim. WEB_CONCURRENCY e lido pelo proprio
              gunicorn, o que ajusta a concorrencia sem alterar a imagem.
            */}}
            - name: WEB_CONCURRENCY
              value: {{ .Values.app.gunicorn.workers | quote }}
            - name: DB_HOST
              value: "todolist-postgres"
            - name: DB_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: DB_NAME
              value: {{ .Values.postgresql.database | quote }}
            - name: DB_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todolist-postgres
                  key: DB_PASSWORD
            - name: SECRETS_DIR
              value: "/var/run/secrets/todolist"

          volumeMounts:
            - name: app-secrets
              mountPath: /var/run/secrets/todolist
              readOnly: true

          {{- /*
            A startupProbe suspende a livenessProbe durante a inicializacao.
            Sem ela, um pod criado pelo scale-up do HPA em no carregado pode ser
            morto antes de terminar de subir, gerando um ciclo de criar/matar.
          */}}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3

          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}

      volumes:
        - name: app-secrets
          secret:
            secretName: todolist-app
