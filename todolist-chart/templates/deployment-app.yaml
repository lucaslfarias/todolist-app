apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: todolist
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: todolist
  template:
    metadata:
      labels:
        app: todolist
        app.kubernetes.io/name: todolist
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: todolist

      # Aguarda o PostgreSQL aceitar conexões antes de iniciar a app
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z todolist-postgres {{ .Values.postgresql.port }}; do
                echo "waiting for postgres..."; sleep 2
              done

      containers:
        - name: todolist
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}

          env:
            - name: APP_NAME
              value: {{ .Values.app.env.APP_NAME | quote }}
            - name: APP_COLOR
              value: {{ .Values.app.env.APP_COLOR | quote }}
            - name: APP_PORT
              value: {{ .Values.app.port | quote }}
            - name: DB_HOST
              value: "todolist-postgres"
            - name: DB_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: DB_NAME
              value: {{ .Values.postgresql.database | quote }}
            - name: DB_USER
              value: {{ .Values.postgresql.user | quote }}
            # DB_PASSWORD via env var — a app lê arquivo primeiro, env como fallback
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todolist-postgres
                  key: DB_PASSWORD
            - name: SECRETS_DIR
              value: "/var/run/secrets/todolist"

          # SESSION_KEY, ADMIN_USER, ADMIN_PASSWORD, CLEANUP_TOKEN montados como arquivos
          volumeMounts:
            - name: app-secrets
              mountPath: /var/run/secrets/todolist
              readOnly: true

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}

      volumes:
        - name: app-secrets
          secret:
            secretName: todolist-app