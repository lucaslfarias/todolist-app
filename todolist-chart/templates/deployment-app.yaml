apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: todolist
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- /*
    MUDANCA 1 — com o HPA ligado, o campo replicas NAO vai no manifesto.

    Se ele ficar aqui, todo `helm upgrade` (e todo sync do ArgoCD com
    selfHeal: true) reescreve replicas para o valor do values.yaml e
    desfaz o que o HPA acabou de decidir. O resultado e um pingue-pongue:
    HPA sobe para 5, ArgoCD derruba para 2, HPA sobe de novo.

    Com o campo ausente, o HPA e o unico dono de spec.replicas.
    Na primeira instalacao o Deployment sobe com 1 pod e o HPA ajusta para
    minReplicas em poucos segundos.
  */}}
  {{- if not .Values.app.hpa.enabled }}
  replicas: {{ .Values.app.replicas }}
  {{- end }}

  revisionHistoryLimit: 5

  {{- /*
    MUDANCA 2 — rollout surge-first.
    maxUnavailable: 0 garante que o rollout nunca reduz a capacidade abaixo
    do numero atual de replicas, entao ele nunca conflita com o PDB.
  */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: todolist
  template:
    metadata:
      labels:
        app: todolist
        app.kubernetes.io/name: todolist
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: todolist

      {{- /*
        MUDANCA 3 — espalhar as replicas entre os nos.
        Um PDB so protege de verdade se os pods estiverem em nos diferentes:
        com 2 replicas no mesmo no, drenar esse no derruba as duas de uma vez
        e o PDB apenas atrasa o inevitavel.
        whenUnsatisfiable: ScheduleAnyway e proposital — com 2 workers e
        maxReplicas 5 o scheduler PRECISA poder empilhar; DoNotSchedule
        deixaria pods Pending e travaria o scale-up do HPA.
      */}}
      {{- with .Values.app.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- /*
        MUDANCA 4 — janela de shutdown gracioso.
        No scale-down o HPA mata pods; sem o preStop o pod para de aceitar
        conexoes antes de o kube-proxy/ingress removerem o endpoint, e o
        usuario ve 502.
      */}}
      terminationGracePeriodSeconds: {{ .Values.app.terminationGracePeriodSeconds }}

      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z todolist-postgres {{ .Values.postgresql.port }}; do
                echo "waiting for postgres..."; sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi

      containers:
        - name: todolist
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}

          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.app.preStopSleepSeconds }}"]

          env:
            - name: APP_NAME
              value: {{ .Values.app.env.APP_NAME | quote }}
            - name: APP_COLOR
              value: {{ .Values.app.env.APP_COLOR | quote }}
            - name: APP_PORT
              value: {{ .Values.app.port | quote }}
            {{- /*
              MUDANCA 5 — concorrencia do gunicorn.
              O CMD do Dockerfile nao passa --workers, entao o gunicorn sobe
              com 1 worker sync: 1 requisicao por vez por pod. Nesse regime o
              pod satura em latencia muito antes de a CPU media dizer qualquer
              coisa util, e o sinal do HPA fica ruim.
              WEB_CONCURRENCY e lido pelo proprio gunicorn, sem tocar na imagem.
            */}}
            - name: WEB_CONCURRENCY
              value: {{ .Values.app.gunicorn.workers | quote }}
            - name: DB_HOST
              value: "todolist-postgres"
            - name: DB_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: DB_NAME
              value: {{ .Values.postgresql.database | quote }}
            - name: DB_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todolist-postgres
                  key: DB_PASSWORD
            - name: SECRETS_DIR
              value: "/var/run/secrets/todolist"

          volumeMounts:
            - name: app-secrets
              mountPath: /var/run/secrets/todolist
              readOnly: true

          {{- /*
            MUDANCA 6 — startupProbe.
            Sem ela, a livenessProbe comeca a contar em 10s. Num pod recem
            criado pelo scale-up, sob no carregado, isso pode matar o pod
            antes de ele subir — e o HPA entra em loop de criar/matar.
          */}}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3

          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}

      volumes:
        - name: app-secrets
          secret:
            secretName: todolist-app
