apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: todolist
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: todolist
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: todolist
subjects:
  - kind: ServiceAccount
    name: todolist
    namespace: {{ .Release.Namespace }}
