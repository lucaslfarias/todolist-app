apiVersion: v1
kind: Secret
metadata:
  name: todolist-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: todolist
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgresql.secret.POSTGRES_PASSWORD | quote }}
  DB_PASSWORD:       {{ .Values.postgresql.secret.POSTGRES_PASSWORD | quote }}
