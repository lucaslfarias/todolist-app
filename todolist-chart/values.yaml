app:
  image:
    repository: ghcr.io/lucaslfarias/todolist-app
    tag: 3b1e404
    pullPolicy: IfNotPresent
  replicas: 2
  port: 5000
  env:
    APP_NAME: TodoList
    APP_COLOR: green
  secret:
    SESSION_KEY: dev-session-key
    ADMIN_USER: admin
    ADMIN_PASSWORD: admin
    CLEANUP_TOKEN: dev-cleanup-token
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPU: 70
    targetMemory: 80
  pdb:
    enabled: true
    minAvailable: 1
postgresql:
  image:
    repository: postgres
    tag: '16'
    pullPolicy: IfNotPresent
  port: 5432
  database: todolist
  user: todolist
  secret:
    POSTGRES_PASSWORD: todolist
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
cleanup:
  schedule: '*/5 * * * *'
  image:
    repository: curlimages/curl
    tag: '16'
    pullPolicy: IfNotPresent
ingress:
  enabled: true
  host: localhost
  ingressClassName: nginx
