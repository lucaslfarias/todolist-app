app:
  image:
    repository: ghcr.io/lucaslfarias/todolist-app
    tag: "27a8b3a"
    pullPolicy: IfNotPresent

  replicas: 2
  port: 5000
  env:
    APP_NAME: TodoList
    APP_COLOR: pink
  secret:
    SESSION_KEY: dev-session-key
    ADMIN_USER: admin
    ADMIN_PASSWORD: admin
    CLEANUP_TOKEN: dev-cleanup-token

  gunicorn:
    workers: 2

  terminationGracePeriodSeconds: 30

  resources:
    requests:
      cpu: 200m
      memory: 192Mi
    limits:
      cpu: 600m
      memory: 384Mi

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPU: 70
    targetMemory: null
    extraMetrics: []
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 30
        policies:
          - type: Percent
            value: 100
            periodSeconds: 30
          - type: Pods
            value: 2
            periodSeconds: 30
        selectPolicy: Max
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Pods
            value: 1
            periodSeconds: 60
        selectPolicy: Min

  pdb:
    enabled: true
    maxUnavailable: 1
    minAvailable: null
    unhealthyPodEvictionPolicy: AlwaysAllow

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: todolist

postgresql:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  port: 5432
  database: todolist
  user: todolist
  secret:
    POSTGRES_PASSWORD: todolist
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  pdb:
    enabled: true
    minAvailable: 1
    maxUnavailable: null
    unhealthyPodEvictionPolicy: AlwaysAllow

cleanup:
  schedule: "*/5 * * * *"
  image:
    repository: curlimages/curl
    tag: "8.7.1"
    pullPolicy: IfNotPresent

ingress:
  enabled: true
  host: localhost
  ingressClassName: nginx