## Dev enviroment app + postgress
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: todolist
      POSTGRES_USER: todolist
      POSTGRES_PASSWORD: todolist
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todolist -d todolist"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      APP_NAME: TodoList
      APP_PORT: "5000"
      APP_COLOR: blue
      SESSION_KEY: dev-session-key
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
      CLEANUP_TOKEN: dev-cleanup-token
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: todolist
      DB_USER: todolist
      DB_PASSWORD: todolist
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

