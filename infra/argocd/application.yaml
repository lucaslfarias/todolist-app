apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todolist
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/lucaslfarias/todolist-app
    targetRevision: HEAD
    path: todolist-chart
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: todolist

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true.
  # ---------------------------------------------------------------------------
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: todolist
      jsonPointers:
        - /spec/replicas
      managedFieldsManagers:
        - kube-controller-manager
