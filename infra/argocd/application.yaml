apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todolist
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/lucaslfarias/todolist-app
    targetRevision: HEAD
    path: todolist-chart
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: todolist

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  # ---------------------------------------------------------------------------
  # Convivencia entre HPA e selfHeal.
  #
  # selfHeal reverte qualquer divergencia entre cluster e Git, e spec.replicas
  # de um Deployment com HPA diverge por design. O template ja omite o campo
  # quando hpa.enabled = true, o que resolve o caso principal; a excecao abaixo
  # e a segunda camada, cobrindo ambientes com o HPA desligado e evitando
  # OutOfSync permanente caso o campo reapareca.
  #
  # managedFieldsManagers e o mecanismo correto sob ServerSideApply: instrui o
  # ArgoCD a ignorar os campos cujo owner e o controller do HPA.
  # ---------------------------------------------------------------------------
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: todolist
      jsonPointers:
        - /spec/replicas
      managedFieldsManagers:
        - kube-controller-manager
