name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'Dockerfile'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lucaslfarias/todolist-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Update image tag in values.yaml
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | cut -d: -f2)
          sed -i "s|repository: localhost:5001/todolist-app|repository: ghcr.io/${{ env.IMAGE_NAME }}|g" todolist-chart/values.yaml
          sed -i "s|tag: .*|tag: ${TAG}|" todolist-chart/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add todolist-chart/values.yaml
          git commit -m "ci: update image tag to ${TAG} [skip ci]"
          git push